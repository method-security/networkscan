# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: networkscan

partial:
  by: target

builds:
  - id: build-linux-amd64
    main: .
    binary: networkscan
    # Not static: a static binary cannot dlopen libpcap, silently breaking SYN capture.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
    goarm:
      - "7"
  - id: build-linux-arm64
    main: .
    binary: networkscan
    # See build-linux-amd64.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - arm64
    goarm:
      - "7"
  - id: build-macos
    main: .
    binary: networkscan
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
    goarm:
      - "7"
  - id: build-windows
    main: .
    binary: networkscan
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
    env:
      - CGO_ENABLED=1
    goos:
      - windows
    goarch:
      - amd64
