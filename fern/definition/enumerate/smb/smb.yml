imports:
  common: ../../common/protocol/smb.yml

types:
  
  
  # Main enumeration details
  EnumerateSmbDetails:
    properties:
      target: string
      version: optional<common.SmbVersion>
      supportedVersions: optional<list<common.SmbVersion>>
      shares: optional<list<common.SmbShare>>
      authMethods: optional<list<common.AuthMethod>>
      serverInfo: optional<common.SmbServerInfo>
      anonymousLoginAllowed: optional<boolean>
      guestLoginAllowed: optional<boolean>
      nullSessionAllowed: optional<boolean>
      signingRequired: optional<boolean>
      encryptionSupported: optional<boolean>
      authAttempts: optional<list<common.AuthAttempt>>
      rawResponse: optional<string>