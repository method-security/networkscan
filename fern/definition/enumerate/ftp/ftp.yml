types:
  # ENUMs
  FtpEntryType:
    enum:
      - FILE
      - DIRECTORY
      - LINK
      - UNKNOWN

  # Common Objects
  FtpDirectoryEntry:
    properties:
      name: string
      type: FtpEntryType
      size: optional<long>
      permissions: optional<string>
      lastModified: optional<string>

  # Report structs
  EnumerateFtpDetails:
    properties:
      target: string
      successfulConnection: optional<boolean>
      banner: optional<string>
      tlsImplemented: optional<boolean>
      tlsForced: optional<boolean>
      allowsAnonymousLogin: optional<boolean>
      directoryListing: optional<list<FtpDirectoryEntry>>
      error: optional<string>
