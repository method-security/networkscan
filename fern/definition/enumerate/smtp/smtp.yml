imports:
  smtpProtocol: ../../common/protocol/smtp.yml

types:
  # ENUMs
  SmtpUserEnumerationMethod:
    enum:
      - VRFY
      - EXPN
      - RCPT_TO

  # Common Objects
  SmtpEnumeratedUser:
    properties:
      username: string
      exists: boolean
      method: SmtpUserEnumerationMethod
      response: optional<string>

  # Report structs
  EnumerateSmtpDetails:
    properties:
      target: string
      canConnect: optional<boolean>
      serverInfo: optional<smtpProtocol.SmtpServerInfo>
      forceTLS: optional<boolean>
      allowsUnauthenticatedEmail: optional<boolean>
      enumeratedUsers: optional<list<SmtpEnumeratedUser>>

  SmtpEnumerateConfig:
    properties:
      # Overrides greeting-probe TLS detection when the caller already knows the transport.
      implicitTls: optional<boolean>
