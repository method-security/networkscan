imports:
  ssh: ./ssh/ssh.yml
  ftp: ./ftp/ftp.yml
  smtp: ./smtp/smtp.yml
  grpc: ./grpc/grpc.yml
  smb: ./smb/smb.yml
  ldap: ./ldap/ldap.yml
types:
  # ENUMs
  SupportedServiceType:
    enum:
      - SSH
      - FTP
      - SMTP
      - GRPC
      - SMB
      - LDAP
  # Report structs
  EnumerateServiceDetails:
    union:
      EnumerateSshDetails: ssh.EnumerateSshDetails
      EnumerateFtpDetails: ftp.EnumerateFtpDetails
      EnumerateSmtpDetails: smtp.EnumerateSmtpDetails
      EnumerateGrpcDetails: grpc.EnumerateGrpcDetails
      EnumerateSmbDetails: smb.EnumerateSmbDetails
      EnumerateLdapDetails: ldap.EnumerateLdapDetails
  EnumerateServiceResult:
    properties:
      details: optional<list<EnumerateServiceDetails>>
  # Config
  EnumerateServiceConfig:
    properties:
      targets: list<string>
      service: SupportedServiceType
      timeout: integer
      
      # Stealth configuration
      attemptDelay: optional<integer> # Delay in seconds between enumeration attempts
      
      # SMB-specific configuration (only applies when service is SMB)
      noGuest: optional<boolean> # Disable guest authentication attempts for SMB
      noAnonymous: optional<boolean> # Disable anonymous authentication attempts for SMB
  # Final report
  EnumerateServiceReport:
    properties:
      config: EnumerateServiceConfig
      result: EnumerateServiceResult
      errors: optional<list<string>>
