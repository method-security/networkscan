imports:
  ssh: ./ssh/ssh.yml
  ftp: ./ftp/ftp.yml
  smtp: ./smtp/smtp.yml
  grpc: ./grpc/grpc.yml
  smb: ./smb/smb.yml
  ldap: ./ldap/ldap.yml
  ike: ./ike/ike.yml
  snmp: ./snmp/snmp.yml
  mongodb: ./mongodb/mongodb.yml
  pop3: ./pop3/pop3.yml
types:
  # ENUMs
  SupportedServiceType:
    enum:
      - SSH
      - FTP
      - SMTP
      - GRPC
      - SMB
      - LDAP
      - IKE
      - SNMP
      - MONGODB
      - POP3
  # Report structs
  EnumerateServiceDetails:
    union:
      EnumerateSshDetails: ssh.EnumerateSshDetails
      EnumerateFtpDetails: ftp.EnumerateFtpDetails
      EnumerateSmtpDetails: smtp.EnumerateSmtpDetails
      EnumerateGrpcDetails: grpc.EnumerateGrpcDetails
      EnumerateSmbDetails: smb.EnumerateSmbDetails
      EnumerateLdapDetails: ldap.EnumerateLdapDetails
      EnumerateIkeDetails: ike.EnumerateIkeDetails
      EnumerateSnmpDetails: snmp.EnumerateSnmpDetails
      EnumerateMongodbDetails: mongodb.EnumerateMongodbDetails
      EnumeratePop3Details: pop3.EnumeratePop3Details
  EnumerateServiceResult:
    properties:
      details: optional<list<EnumerateServiceDetails>>
  # Config
  EnumerateServiceConfig:
    properties:
      targets: list<string>
      service: SupportedServiceType
      timeout: integer
      wordlist: optional<list<string>>
  # Final report
  EnumerateServiceReport:
    properties:
      config: EnumerateServiceConfig
      result: EnumerateServiceResult
      errors: optional<list<string>>
