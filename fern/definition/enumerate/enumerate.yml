imports:
  ssh: ./ssh/ssh.yml
  ftp: ./ftp/ftp.yml
  smtp: ./smtp/smtp.yml

types:
  NetworkApplication:
    enum:
      - SSH
      - FTP
      - SMTP
  NetworkApplicationEnumerateDetails:
    union:
      SSHEnumerateDetails: ssh.SSHEnumerateDetails
      FTPEnumerateDetails: ftp.FTPEnumerateDetails
      SMTPEnumerateDetails: smtp.SMTPEnumerateDetails
  NetworkApplicationEnumerateReport:
    properties:
      targets: list<string>
      details: optional<list<NetworkApplicationEnumerateDetails>>
      errors: optional<list<string>>
