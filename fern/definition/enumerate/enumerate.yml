imports:
  ssh: ./ssh/ssh.yml
  ftp: ./ftp/ftp.yml
  smtp: ./smtp/smtp.yml
  grpc: ./grpc/grpc.yml
  smb: ./smb/smb.yml
  ldap: ./ldap/ldap.yml
  ike: ./ike/ike.yml
  snmp: ./snmp/snmp.yml
  imap: ./imap/imap.yml
  ipmi: ./ipmi/ipmi.yml
  mongodb: ./mongodb/mongodb.yml
  mssql: ./mssql/mssql.yml
  mysql: ./mysql/mysql.yml
  pop3: ./pop3/pop3.yml
  postgres: ./postgres/postgres.yml
  redis: ./redis/redis.yml
  socks: ./socks/socks.yml
  rdp: ./rdp/rdp.yml
  vnc: ./vnc/vnc.yml
  nebula: ./nebula/nebula.yml
types:
  # ENUMs
  SupportedServiceType:
    enum:
      - SSH
      - FTP
      - SMTP
      - GRPC
      - SMB
      - LDAP
      - IKE
      - SNMP
      - IMAP
      - IPMI
      - MONGODB
      - MSSQL
      - MYSQL
      - POP3
      - POSTGRES
      - REDIS
      - SOCKS
      - RDP
      - VNC
      - NEBULA
  # Report structs
  EnumerateServiceDetails:
    union:
      EnumerateSshDetails: ssh.EnumerateSshDetails
      EnumerateFtpDetails: ftp.EnumerateFtpDetails
      EnumerateSmtpDetails: smtp.EnumerateSmtpDetails
      EnumerateGrpcDetails: grpc.EnumerateGrpcDetails
      EnumerateSmbDetails: smb.EnumerateSmbDetails
      EnumerateLdapDetails: ldap.EnumerateLdapDetails
      EnumerateIkeDetails: ike.EnumerateIkeDetails
      EnumerateSnmpDetails: snmp.EnumerateSnmpDetails
      EnumerateImapDetails: imap.EnumerateImapDetails
      EnumerateIpmiDetails: ipmi.EnumerateIpmiDetails
      EnumerateMongodbDetails: mongodb.EnumerateMongodbDetails
      EnumerateMssqlDetails: mssql.EnumerateMssqlDetails
      EnumerateMysqlDetails: mysql.EnumerateMysqlDetails
      EnumeratePop3Details: pop3.EnumeratePop3Details
      EnumeratePostgresDetails: postgres.EnumeratePostgresDetails
      EnumerateRedisDetails: redis.EnumerateRedisDetails
      EnumerateSocksDetails: socks.EnumerateSocksDetails
      EnumerateRdpDetails: rdp.EnumerateRdpDetails
      EnumerateVncDetails: vnc.EnumerateVncDetails
      EnumerateNebulaDetails: nebula.EnumerateNebulaDetails
  EnumerateServiceResult:
    properties:
      details: optional<list<EnumerateServiceDetails>>
  # Config
  EnumerateServiceConfig:
    properties:
      targets: list<string>
      service: SupportedServiceType
      timeout: integer
      wordlist: optional<list<string>>
      vncConfig: optional<vnc.VncEnumerateConfig>
      nebulaConfig: optional<nebula.NebulaEnumerateConfig>
  # Final report
  EnumerateServiceReport:
    properties:
      config: EnumerateServiceConfig
      result: EnumerateServiceResult
      errors: optional<list<string>>
