imports:
  bannergrab: ../address/bannergrab.yml
types:
  ScanType:
    enum:
      - SYN
      - CONNECT
  PortScanValidateConfig:
    properties:
      target: string
      ports: optional<string>
      topports: optional<string>
      threads: integer
      scantype: ScanType
      timeout: integer
      skipTLSVerify: boolean
  HttpRequest:
    properties:
      url: string
      method: string
      responseCode: optional<integer>
      responseBody: optional<string>
      error: optional<string>
  PortValidateDetails:
    properties:
      port: integer
      IpRequest: optional<HttpRequest>
      HostRequest: optional<HttpRequest>
  HostValidateDetails:
    properties:
      host: string
      ip: string
      portDetails: optional<list<PortValidateDetails>>
  PortScanValidateReport:
    properties:
      hosts: optional<list<HostValidateDetails>>
      config: PortScanValidateConfig
      errors: optional<list<string>>

