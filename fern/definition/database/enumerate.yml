types:
  DatabaseType:
    enum:
      - MYSQL
      - POSTGRESQL
      - MSSQL
      - ORACLE
  DatabaseEnumerateDetails:
    properties:
      Target: string
      DatabaseType: DatabaseType
      Banner: optional<string>
      Connected: optional<boolean>
      Fingerprinted: optional<boolean>
      PasswordRequired: optional<boolean>
      ExposedData: optional<list<string>>
      Error: optional<string>

