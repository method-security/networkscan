imports:
  smbProtocol: ../common/protocol/smb.yml

types:
  # Common Objects
  DomainControllerInfo:
    properties:
      hostname: optional<string>
      ipAddress: optional<string>
      # Use common SMB server info for consistency across modules
      smbServerInfo: optional<smbProtocol.SmbServerInfo>

  DomainInfo:
    properties:
      netBIOSDomainName: optional<string>
      dnsDomainName: optional<string>
      forestName: optional<string>
      # Include full server info from initial target for complete NTLM information
      serverInfo: optional<smbProtocol.SmbServerInfo>
      domainControllers: optional<list<DomainControllerInfo>>

  # Config Types
  DiscoverDomainConfig:
    properties:
      target: string

  # Result Types
  DiscoverDomainResult:
    properties:
      domainInfo: optional<DomainInfo>

  # Report Types
  DiscoverDomainReport:
    properties:
      config: DiscoverDomainConfig
      result: DiscoverDomainResult
      errors: optional<list<string>>