types:
  # ARP
  ArpEntry:
    properties:
      ip: string
      mac: string
      hwType: optional<string>
      flags: optional<string>
      mask: optional<string>
  ArpInterface:
    properties:
      interface: string
      entries: list<ArpEntry>
  # Config
  DiscoverHostArpConfig:
    properties:
      hostIpAddress: optional<string>
  # Result
  DiscoverHostArpResult:
    properties:
      interfaces: optional<list<ArpInterface>>
  # Final report
  DiscoverHostArpReport:
    properties:
      config: DiscoverHostArpConfig
      result: DiscoverHostArpResult
      errors: optional<list<string>>
