types:
  DiscoverPortConfig:
    properties:
      target: string
      tcpPorts: optional<string>
      udpPorts: optional<string>
      topPorts: optional<string>
      threads: integer
      scanType: string

  PortDetails:
    properties:
      port: integer
      protocol: string

  SocketDetails:
    properties:
      host: string
      ip: string
      ports: optional<list<PortDetails>>

  DiscoverPortReport:
    properties:
      config: DiscoverPortConfig
      hosts: optional<list<SocketDetails>>
      errors: optional<list<string>>
