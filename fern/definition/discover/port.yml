types:
  PortScanType:
    enum:
      - SYN
      - CONNECT

  DiscoverPortConfig:
    properties:
      target: string
      ports: optional<string>
      topPorts: optional<string>
      threads: integer
      scanType: PortScanType

  PortDetails:
    properties:
      port: integer
      protocol: string

  SocketDetails:
    properties:
      host: string
      ip: string
      ports: optional<list<PortDetails>>

  DiscoverPortReport:
    properties:
      config: DiscoverPortConfig
      hosts: optional<list<SocketDetails>>
      errors: optional<list<string>>
