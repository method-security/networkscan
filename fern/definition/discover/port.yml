imports:
  common: ../common/common.yml
types:
  # ENUMs
  PortScanType:
    enum:
      - SYN
      - CONNECT
  # Report structs
  PortDetails:
    properties:
      port: integer
      protocol: common.TransportType
  SocketDetails:
    properties:
      host: string
      ip: string
      ports: optional<list<PortDetails>>
  DiscoverPortResult:
    properties:
      sockets: optional<list<SocketDetails>>
  # Config
  DiscoverPortConfig:
    properties:
      target: string
      ports: optional<string>
      topPorts: optional<string>
      threads: optional<integer>
      scanType: optional<PortScanType>
  # Final report
  DiscoverPortReport:
    properties:
      config: DiscoverPortConfig
      result: DiscoverPortResult
      errors: optional<list<string>>
