imports:
  common: ../common/common.yml
types:
  # ENUMs
  PortScanType:
    enum:
      - SYN
      - CONNECT
  # Stealth config
  PortStealthConfig:
    properties:
      sleep: integer # Sleep delay in seconds between ports
      jitter: optional<integer> # Jitter percentage (0-100) to randomize sleep
  # Report structs
  PortDetails:
    properties:
      port: integer
      protocol: common.TransportType
  SocketDetails:
    properties:
      host: string
      ip: string
      ports: optional<list<PortDetails>>
  DiscoverPortResult:
    properties:
      sockets: optional<list<SocketDetails>>
  # Config
  DiscoverPortConfig:
    properties:
      target: string
      ports: optional<string>
      topPorts: optional<string>
      threads: integer
      scanType: PortScanType
      validate: boolean
      validateHostname: optional<string>
      validateAttemptTimeout: optional<integer>
      validateThreads: optional<integer>
      stealth: optional<PortStealthConfig>
  # Final report
  DiscoverPortReport:
    properties:
      config: DiscoverPortConfig
      result: DiscoverPortResult
      errors: optional<list<string>>
