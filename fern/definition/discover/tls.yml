types:
  # ENUMs
  TlsVersion:
    enum:
      - SSL_2_0
      - SSL_3_0
      - TLS_1_0
      - TLS_1_1
      - TLS_1_2
      - TLS_1_3
      - UNKNOWN
  SignatureAlgorithm:
    enum:
      - MD2_RSA
      - MD5_RSA
      - MD5_ECDSA
      - SHA1_RSA
      - SHA256_RSA
      - SHA384_RSA
      - SHA512_RSA
      - DSA_SHA1
      - DSA_SHA256
      - ECDSA_SHA1
      - ECDSA_SHA256
      - ECDSA_SHA384
      - ECDSA_SHA512
      - SHA256_RSA_PSS
      - SHA384_RSA_PSS
      - SHA512_RSA_PSS
      - ED25519
  PublicKeyAlgorithm:
    enum:
      - DES
      - DH_1024
      - DH_512
      - DH_768
      - DSA
      - DSA_1024
      - ECDSA
      - ECDSA_SHA1
      - ECDH_SHA1
      - ED25519
      - RC4
      - RSA
      - RSA_1024
      - UNKNOWN
  CipherSuite:
    enum:
      - AES_128_GCM_SHA256
      - AES_256_GCM_SHA384
      - CHACHA20_POLY1305_SHA256
      - ECDHE_ECDSA_WITH_AES_128_CBC_SHA
      - ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
      - ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
      - ECDHE_ECDSA_WITH_AES_256_CBC_SHA
      - ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
      - ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
      - ECDHE_ECDSA_WITH_RC4_128_SHA
      - ECDHE_RSA_WITH_3DES_EDE_CBC_SHA
      - ECDHE_RSA_WITH_AES_128_CBC_SHA
      - ECDHE_RSA_WITH_AES_128_CBC_SHA256
      - ECDHE_RSA_WITH_AES_128_GCM_SHA256
      - ECDHE_RSA_WITH_AES_256_CBC_SHA
      - ECDHE_RSA_WITH_AES_256_GCM_SHA384
      - ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
      - ECDHE_RSA_WITH_RC4_128_SHA
      - RSA_WITH_3DES_EDE_CBC_SHA
      - RSA_WITH_AES_128_CBC_SHA
      - RSA_WITH_AES_128_CBC_SHA256
      - RSA_WITH_AES_128_GCM_SHA256
      - RSA_WITH_AES_256_CBC_SHA
      - RSA_WITH_AES_256_GCM_SHA384
      - RSA_WITH_RC4_128_SHA
      - UNKNOWN
  # Common Objects
  Certificate:
    properties:
      certificate: string
      serialNumber: string
      signature: string
      publicKeyAlgorithm: PublicKeyAlgorithm
      signatureAlgorithm: SignatureAlgorithm
      validFrom: datetime
      validTo: datetime
      version: integer
      issuerCommonName: optional<string> # Can be empty
      subjectCommonName: optional<string> # Can be empty
      subjectAlternativeNames: optional<list<string>> # Can be empty
      ja4xFingerprint:
        type: optional<string>
        docs: JA4X X.509 certificate fingerprint (SHA-256 of issuer, subject, and public key info, each truncated to 12 hex chars)
  TlsVersionSupport:
    properties:
      version: TlsVersion
      supported: boolean
      cipherSuites: optional<list<CipherSuite>> # Only populated if supported=true
  TlsConfiguration:
    properties:
      negotiatedVersion: TlsVersion
      negotiatedCipherSuite: CipherSuite
      compressionEnabled: boolean
      secureRenegotiationSupported: boolean
      versionSupport: list<TlsVersionSupport>
      supportedEllipticCurves: optional<list<string>>
      certificates: list<Certificate>
      ja4sFingerprint:
        type: optional<string>
        docs: JA4S server-side TLS fingerprint (version, extension count, ALPN, cipher, and extension hash)
      jarmFingerprint:
        type: optional<string>
        docs: JARM 62-character fingerprint produced by 10 customised TLS ClientHello probes
  TlsSummary:
    properties:
      socket: string
      ipAddress: string
      tlsConfiguration: optional<TlsConfiguration>
  # Result Types
  DiscoverTlsResult:
    properties:
      details: optional<list<TlsSummary>>
  # Config Types
  DiscoverTlsConfig:
    properties:
      targets: list<string>
      timeout: integer
      ja4s:
        type: optional<boolean>
        docs: When true, compute the JA4S server-side TLS fingerprint for each target
      jarm:
        type: optional<boolean>
        docs: When true, compute the JARM fingerprint (10 sequential TLS probes) for each target; adds ~1-5s per target
      ja4x:
        type: optional<boolean>
        docs: When true, compute the JA4X X.509 certificate fingerprint for each certificate
  # Report Types
  DiscoverTlsReport:
    properties:
      config: DiscoverTlsConfig
      result: DiscoverTlsResult
      errors: optional<list<string>>
