types:
  ScanType:
    enum:
      - TCP_SYN
      - TCP_ACK
      - ICMP_ECHO
      - ICMP_TIMESTAMP
      - ARP
      - ICMP_ADDRESS_MASK

  DiscoverHostDetails:
    properties:
      ip: string
      host: string

  DiscoverHostReport:
    properties:
      hosts: list<DiscoverHostDetails>
      errors: list<string>
