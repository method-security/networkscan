types:
  HostScanType:
    enum:
      - TCP_SYN
      - TCP_ACK
      - ICMP_ECHO
      - ICMP_TIMESTAMP
      - ARP
      - ICMP_ADDRESS_MASK
  # Report structs
  HostDetails:
    properties:
      ip: string
      host: string
  # Final report
  DiscoverHostReport:
    properties:
      hosts: list<HostDetails>
      errors: list<string>
