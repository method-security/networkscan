types:
  HostScanType:
    enum:
      - TCP_SYN
      - TCP_ACK
      - ICMP_ECHO
      - ICMP_TIMESTAMP
      - ARP
      - ICMP_ADDRESS_MASK

  HostDetails:
    properties:
      ip: string
      host: string

  DiscoverHostReport:
    properties:
      hosts: list<HostDetails>
      errors: list<string>
