imports:
  common: ../common/common.yml
types:
  # Stealth service types
  StealthServiceType:
    enum:
      - SSH         # SSH protocol fingerprinting
      - HTTP        # HTTP/HTTPS protocol fingerprinting  
      - GRPC        # gRPC protocol fingerprinting
      - KERBEROS    # Kerberos protocol fingerprinting
      - LDAP        # LDAP protocol fingerprinting
      - SMB         # SMB protocol fingerprinting
  # Stealth config
  ServiceStealthConfig:
    properties:
      serviceType: StealthServiceType  # Specific service to fingerprint
  # Report structs
  ServiceDetails:
    properties:
      host: string
      ip: string
      port: integer
      tls: boolean
      version: optional<string>
      transport: common.TransportType
      protocol: common.ProtocolType
      metadata: optional<map<string, string>>
  DiscoverServiceResult:
    properties:
      services: optional<list<ServiceDetails>>
  # Config
  DiscoverServiceConfig:
    properties:
      target: string  # Format: IP:port or hostname:port for TCP, IP or hostname for UDP mode
      timeout: integer
      stealth: optional<ServiceStealthConfig>
      udp: optional<boolean>  # Enable UDP service discovery mode (scans common UDP ports)
  # Final report
  DiscoverServiceReport:
    properties:
      config: DiscoverServiceConfig
      result: DiscoverServiceResult
      errors: optional<list<string>>
