types:
  # Enums
  ProbeType:
    enum:
      - UDP
      - ICMP
  # Structs
  TracerouteHop:
    properties:
      hopNumber: integer
      ipAddress: optional<string>
      hostname: optional<string>
      rtts: optional<list<double>>
      timeout: boolean
  TracerouteResult:
    properties:
      target: string
      targetIp: string
      hops: list<TracerouteHop>
      completed: boolean
  # Stealth config
  RouteStealthConfig:
    properties:
      sleep: optional<integer> # Sleep delay in seconds between targets
      jitter: optional<integer> # Jitter percentage (0-100) to randomize sleep
  # Config
  DiscoverRouteConfig:
    properties:
      targets: list<string>
      hostIp: optional<string>
      excludeTimeoutHops: boolean
      probesPerHop: integer
      probeDelay: integer
      maxHops: integer
      timeout: integer
      probeType: ProbeType
      port: integer
      stealth: optional<RouteStealthConfig>
  # Result  
  DiscoverRouteResult:
    properties:
      traceroutes: list<TracerouteResult>
  # Final report
  DiscoverRouteReport:
    properties:
      config: DiscoverRouteConfig
      result: DiscoverRouteResult
      errors: optional<list<string>>
