types:
  # WinRM (Windows Remote Management) Server Information
  WinrmServerInfo:
    properties:
      # Discovery fields
      server: optional<string>
      statusCode: optional<string>
      scheme: optional<string>
      productVersion: optional<string>
      protocolVersion: optional<string>

      # Additional WinRM protocol details
      maxEnvelopeSize: optional<integer>
      maxTimeoutMs: optional<integer>
      authSchemes: optional<list<string>>

  # Authentication result for any WinRM operation
  WinrmAuthAttempt:
    properties:
      username: string
      password: string
      domain: optional<string>
      success: boolean
      message: string
      timestamp: datetime
      errorCode: optional<string>

  # Command execution via WinRM
  WinrmCommandExecution:
    properties:
      command: string
      output: string
      exitCode: optional<integer>
      timestamp: datetime
