types:
  S7CommServerInfo:
    properties:
      cpuFamily: optional<string>           # Inferred from MLFB: "S7-1500" | "S7-1200" | "S7-300" | "S7-400" | "LOGO" | "ET200"
      cpuType: optional<string>             # e.g. "CPU 1515-2 PN" — SZL 0x001C index 7 (module type name)
      orderCode: optional<string>           # MLFB, e.g. "6ES7515-2AM02-0AB0" — SZL 0x0011 index 1
      firmwareVersion: optional<string>     # "V2.9.4" — built as V.R.A from SZL 0x0011 Ausbg/Ausbe bytes
      hardwareVersion: optional<string>     # SZL 0x0011 BGType bytes (hex)
      moduleName: optional<string>          # SZL 0x001C index 2 (friendly module name)
      moduleTypeName: optional<string>      # SZL 0x001C index 7 (same as cpuType — kept for parity with the SZL spec)
      systemName: optional<string>          # SZL 0x001C index 1 (PLC / automation-system name)
      copyright: optional<string>           # SZL 0x001C index 4
      serialNumber: optional<string>        # SZL 0x001C index 5 (module serial number)
      plantId: optional<string>             # SZL 0x001C index 3 (plant designation)
      locationDesignation: optional<string> # SZL 0x001C index 11 (0x000B)
      rack: optional<integer>               # parsed from TSAP we connected with
      slot: optional<integer>               # parsed from TSAP we connected with
