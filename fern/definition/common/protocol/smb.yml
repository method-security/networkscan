imports:
  ntlmProtocol: ./ntlm.yml

types:
  # SMB Protocol ENUMs
  SmbVersion:
    enum:
      - SMB1
      - SMB2_0
      - SMB2_1
      - SMB3_0
      - SMB3_0_2
      - SMB3_1_1

  AuthMethod:
    enum:
      - NTLM
      - KERBEROS

  ShareType:
    enum:
      - DISK
      - PRINT
      - DEVICE
      - IPC
      - UNKNOWN

  ShareAccess:
    enum:
      - READ_ONLY
      - READ_WRITE
      - NO_ACCESS
      - UNKNOWN

  # Core SMB Protocol Objects
  SmbServerInfo:
    extends: ntlmProtocol.NtlmServerInfo
    properties:
      # SMB-specific protocol details
      smbVersion: optional<SmbVersion> # Primary SMB version in use
      supportedSmbVersions: optional<list<SmbVersion>> # All supported SMB versions

      # SMB-specific security capabilities
      signingRequired: optional<boolean> # Whether SMB signing is required (enforced)
      encryptionSupported: optional<boolean>
      encryptionRequired: optional<boolean>

      # SMB-specific version information
      lanManagerVersion: optional<string> # LAN Manager version if available

  SmbShare:
    properties:
      name: string
      type: ShareType
      comment: optional<string>
      accessible: optional<boolean>
      access: optional<ShareAccess>
      anonymousAccess: optional<boolean>
      guestAccess: optional<boolean>
      hidden: optional<boolean>

  # Authentication result for any SMB operation
  SmbAuthAttempt:
    properties:
      username: string
      password: string
      domain: optional<string>
      success: boolean
      message: string
      isAdmin: optional<boolean> # For successful auths, indicates admin privileges
      timestamp: datetime
      errorCode: optional<string> # SMB/NTLM error code if applicable

  # Command execution via SMB (WMI/MSRPC)
  SmbCommandExecution:
    properties:
      command: string
      output: string
      exitCode: optional<integer>
      timestamp: datetime
