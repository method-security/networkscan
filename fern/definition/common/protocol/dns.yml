types:
  # Mirrors the set the ontology DnsRecord object models.
  DnsRecordType:
    enum:
      - A
      - AAAA
      - CAA
      - CNAME
      - DS
      - HTTPS
      - MX
      - NAPTR
      - NS
      - PTR
      - SOA
      - SRV
      - SSHFP
      - SVCB
      - TLSA
      - TXT
      - UNKNOWN

  DnsRecord:
    properties:
      name: string
      ttl: integer
      type: DnsRecordType
      value: string

  # DNS Server Information
  DnsServerInfo:
    properties:
      # Discovery fields
      responseCode: optional<string>
      authoritative: optional<boolean>
      recursionAvailable: optional<boolean>
      dnsVersion: optional<string>
      edns0Support: optional<boolean>
      udpBufferSize: optional<string>

      # Additional DNS protocol details
      serverName: optional<string>
      supportedRecordTypes: optional<list<string>>
      dnssecEnabled: optional<boolean>
