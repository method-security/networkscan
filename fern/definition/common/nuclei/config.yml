types:
  # Nuclei Configuration for Network CVE Scanning
  NucleiConfig:
    properties:
      targets: list<string>
      protocol: optional<string> # Application protocol to filter templates (e.g., FTP, SSH, HTTP)
      templatePaths: optional<list<string>>
      timeout: integer
      threads: integer
      verboseLogs: boolean
      globalRateLimit: integer
